name: My First CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Show environment
        run: |
          node -v
          npm -v
          docker --version

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: docker build -t cicd-study:ci .